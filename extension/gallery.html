<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aside 图标</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
<main>
  <header class="hero">
    <div>
      <h1>Aside 图标</h1>
      <p>为固定区和标签页换上统一风格的网站图标。</p>
    </div>
    <span id="version"></span>
  </header>

  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

  <!-- page-wide settings sit above the list so they never need a long scroll -->
  <section class="strip" aria-label="设置">
    <div class="grp">
      <span id="toggle-label">替换图标</span>
      <button id="toggle" type="button" class="switch" role="switch" aria-checked="true" aria-labelledby="toggle-label" aria-describedby="toggle-state" disabled></button>
    </div>
    <div class="grp">
      <span id="style-label">默认样式</span>
      <div class="seg" id="style" role="radiogroup" aria-labelledby="style-label" aria-describedby="style-note"></div>
    </div>
  </section>
  <p class="strip-note"><span id="toggle-state"></span><span id="style-note"></span></p>

  <div class="top">
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" type="search" placeholder="搜索网站或域名" autocomplete="off" aria-label="搜索网站" autofocus>
        <kbd aria-hidden="true">/</kbd>
      </label>
      <select id="categories" aria-label="类别"></select>
    </div>
  </div>

  <section aria-labelledby="all-title">
    <h2 class="group-title" id="all-title">网站 <span id="count" aria-live="polite"></span></h2>
    <div class="table" id="sites" aria-label="网站列表"></div>
    <p id="empty" class="note empty" hidden>没有找到匹配的网站。</p>
  </section>

  <section aria-labelledby="tools-title">
    <h2 class="group-title" id="tools-title">工具</h2>
    <div class="list">
      <div class="item">
        <div class="label"><b>重新应用到已打开的网页</b><span>保存时会自动做一次；图标没换过来时再用</span></div>
        <button id="refresh" type="button" class="btn" disabled>重新应用</button>
      </div>
      <div class="item">
        <div class="label"><b>导出设置</b><span>保存为 JSON 文件，换电脑时导入</span></div>
        <button id="export" type="button" class="btn" disabled>导出…</button>
      </div>
      <div class="item">
        <div class="label"><b>导入设置</b><span>导入后先检查，再点保存</span></div>
        <button id="import" type="button" class="btn" disabled>导入…</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
    </div>
  </section>
</main>

<div class="savebar" id="savebar">
  <span id="bar-text" aria-live="polite">所有更改已保存</span>
  <button id="discard" type="button" class="ghost" hidden>放弃</button>
  <button id="save" type="button" class="go" disabled>已保存</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="library.js"></script>
<script src="gallery.js"></script>
</body>
</html>
