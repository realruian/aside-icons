<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aside 图标</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><h1>Aside 图标</h1><span id="version"></span></div>
    <div class="top-actions">
      <div class="switch-group">
        <span class="switch-label">替换图标</span>
        <button id="toggle" type="button" class="switch" role="switch" aria-checked="true" aria-label="替换图标" disabled><span></span></button>
        <span id="toggle-state" class="switch-state"></span>
      </div>
      <button id="refresh" type="button" class="btn" disabled title="清除缓存，重画所有已打开网页的图标">刷新图标</button>
    </div>
  </div>
</header>

<main>
  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

  <section class="card mine" aria-labelledby="mine-title">
    <div class="card-head">
      <div>
        <h2 id="mine-title">我的固定区</h2>
        <p class="hint" id="mine-hint">点一个图标，在右边换版本。这里按实际大小显示。</p>
      </div>
      <div class="field">
        <span class="field-label">图标大小</span>
        <div class="segmented" id="size" role="radiogroup" aria-label="图标大小"></div>
      </div>
    </div>
    <div class="mine-layout">
      <div id="pins" class="pins" role="listbox" aria-label="我的网站"></div>
      <div id="editor" class="editor" aria-live="polite"></div>
    </div>
    <div class="quick">
      <span class="field-label">一键设置我的网站</span>
      <button type="button" class="btn" data-bulk="mine:optimized">全部用优化版</button>
      <button type="button" class="btn" data-bulk="mine:iphone">全部用 iPhone 版</button>
      <button type="button" class="btn" data-bulk="mine:mac">全部用 Mac 版</button>
      <button type="button" class="btn" data-bulk="mine:original">全部恢复原版</button>
    </div>
  </section>

  <section class="card all" aria-labelledby="all-title">
    <div class="card-head">
      <div>
        <h2 id="all-title">全部网站</h2>
        <p class="hint" id="count"></p>
      </div>
      <button type="button" class="btn" data-bulk="all:optimized">全部网站用优化版</button>
    </div>
    <input id="search" type="search" placeholder="搜索网站名称或域名" autocomplete="off" aria-label="搜索网站">
    <div id="categories" class="chips" role="tablist" aria-label="类别"></div>
    <div class="list-head" aria-hidden="true"><span>网站</span><span>原版</span><span>iPhone</span><span>Mac</span><span>优化版</span><span>固定区</span></div>
    <div id="sites" class="sites"></div>
    <p id="empty" class="empty" hidden>没有找到匹配的网站。</p>
  </section>

  <footer class="foot">
    <button id="export" type="button" class="link" disabled>导出设置</button>
    <span>·</span>
    <button id="import" type="button" class="link" disabled>导入设置</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
  </footer>
</main>

<div class="savebar" id="savebar">
  <div class="savebar-inner">
    <span id="bar-text" aria-live="polite">所有更改已保存</span>
    <button id="discard" type="button" class="btn" hidden>放弃更改</button>
    <button id="save" type="button" class="btn primary" disabled>已保存</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="library.js"></script>
<script src="resize.js"></script>
<script src="gallery.js"></script>
</body>
</html>
