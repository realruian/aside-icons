<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aside 图标</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>Aside 图标 <span id="version"></span></h1>
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" type="search" placeholder="搜索网站名称或域名" autocomplete="off" aria-label="搜索网站" autofocus>
        <kbd aria-hidden="true">/</kbd>
      </label>
      <select id="categories" aria-label="类别"></select>
    </div>
  </div>
</header>

<main>
  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

  <section aria-labelledby="all-title">
    <h2 class="group-title" id="all-title">网站 <span id="count" aria-live="polite"></span></h2>
    <div class="panel" id="sites" aria-label="网站列表"></div>
    <p id="empty" class="note empty" hidden>没有找到匹配的网站。</p>
  </section>

  <section aria-labelledby="settings-title">
    <h2 class="group-title" id="settings-title">设置</h2>
    <div class="panel">
      <div class="item">
        <div class="label"><b id="style-label">所有网站统一使用</b><span id="style-note"></span></div>
        <div class="choices" id="style" role="radiogroup" aria-labelledby="style-label"></div>
      </div>
      <div class="item">
        <div class="label"><b id="toggle-label">替换网站图标</b><span id="toggle-state"></span></div>
        <button id="toggle" type="button" class="switch" role="switch" aria-checked="true" aria-labelledby="toggle-label" disabled></button>
      </div>
      <div class="item">
        <div class="label"><b id="size-label">固定区图标大小</b></div>
        <div class="choices" id="size" role="radiogroup" aria-labelledby="size-label"></div>
      </div>
      <div class="item">
        <div class="label"><b>刷新图标</b><span>重画所有已打开网页的图标</span></div>
        <button id="refresh" type="button" class="btn" disabled>刷新</button>
      </div>
    </div>
  </section>

  <section aria-labelledby="backup-title">
    <h2 class="group-title" id="backup-title">备份</h2>
    <div class="panel">
      <div class="item">
        <div class="label"><b>导出设置</b><span>保存为 JSON 文件，换电脑时导入</span></div>
        <button id="export" type="button" class="btn" disabled>导出…</button>
      </div>
      <div class="item">
        <div class="label"><b>导入设置</b><span>导入后先检查，再点保存</span></div>
        <button id="import" type="button" class="btn" disabled>导入…</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
    </div>
  </section>
</main>

<div class="savebar" id="savebar">
  <div class="savebar-inner">
    <span id="bar-text" aria-live="polite">所有更改已保存</span>
    <div class="bar-actions">
      <button id="discard" type="button" class="btn" hidden>放弃更改</button>
      <button id="save" type="button" class="btn primary" disabled>已保存</button>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="library.js"></script>
<script src="resize.js"></script>
<script src="gallery.js"></script>
</body>
</html>
